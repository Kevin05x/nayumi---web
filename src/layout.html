<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#071a38" />
    <meta
      name="description"
      content="Agencia de Empleos NAYUMI. Conectamos hogares y empresas con personal confiable en Lima. Conoce nuestros servicios y encuentra tu próxima oportunidad."
    />
    <meta name="robots" content="index, follow" />
    <title>NAYUMI — Agencia de empleos en Lima</title>
    <link rel="canonical" href="https://nayumi.com.pe/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:site_name" content="NAYUMI" />
    <meta property="og:title" content="NAYUMI — Agencia de empleos en Lima" />
    <meta
      property="og:description"
      content="Agencia de Empleos NAYUMI. Conectamos hogares y empresas con personal confiable en Lima. Conoce nuestros servicios y encuentra tu próxima oportunidad."
    />
    <meta property="og:url" content="https://nayumi.com.pe/" />
    <meta property="og:image" content="https://nayumi.com.pe/assets/hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/nayumi.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/hero.webp" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="styles/site.css" />
    <link rel="stylesheet" href="styles/contact.css" />
    <script type="module" src="scripts/main.js"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EmploymentAgency",
        "name": "NAYUMI",
        "description": "Agencia de Empleos NAYUMI. Conectamos hogares y empresas con personal confiable en Lima.",
        "url": "https://nayumi.com.pe/",
        "image": "https://nayumi.com.pe/assets/hero.webp",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Nicolás Ayllón 3080",
          "addressLocality": "Ate",
          "addressRegion": "Lima",
          "addressCountry": "PE"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="reading-progress" aria-hidden="true"></div>
    {{ component:header }}
    <main id="contenido">
      {{ component:hero }} {{ component:agency }} {{ component:services }} {{ component:process }}
      {{ component:values }} {{ component:purpose }} {{ component:office }} {{ component:contact }}
    </main>
    {{ component:footer }}
  </body>
</html>
