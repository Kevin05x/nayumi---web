<!doctype html>
<html lang="es-PE">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#081623" />
    <meta
      name="description"
      content="Agencia de Empleos NAYUMI. Conectamos hogares y empresas con personal confiable en Lima. Conoce nuestros servicios y encuentra tu próxima oportunidad."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>NAYUMI — Agencia de empleos en Lima</title>
    <link rel="icon" href="assets/nayumi.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/hero.webp" as="image" fetchpriority="high" />
    <link rel="stylesheet" href="styles/site.css" />
    <link rel="stylesheet" href="styles/contact.css" />
    <script type="module" src="scripts/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <div class="reading-progress" aria-hidden="true"></div>
    {{ component:header }}
    <main id="contenido">
      {{ component:hero }} {{ component:agency }} {{ component:services }} {{ component:process }}
      {{ component:values }} {{ component:purpose }} {{ component:office }} {{ component:contact }}
    </main>
    {{ component:footer }}
    <button
      class="motion-toggle"
      aria-pressed="false"
      aria-label="Reducir animaciones"
      title="Reducir animaciones"
      ><span class="motion-symbol" aria-hidden="true">Ⅱ</span
      ><span class="motion-label">Movimiento</span></button
    >
  </body>
</html>
